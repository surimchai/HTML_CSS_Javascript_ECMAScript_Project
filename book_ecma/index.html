<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도서 관리 시스템 (ECMAScript + Vite)</title>
  </head>
  <body>
    <h1>도서 관리 시스템 <span id="appMode" class="app-mode"></span></h1>

    <div class="form-container">
      <h2>도서 등록</h2>
      <form id="bookForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="title">제목:</label>
            <input type="text" id="title" name="title" required />
          </div>

          <div class="form-group">
            <label for="author">저자:</label>
            <input type="text" id="author" name="author" required />
          </div>

          <div class="form-group">
            <label for="isbn">ISBN:</label>
            <input type="text" id="isbn" name="isbn" required />
          </div>

          <div class="form-group">
            <label for="price">가격:</label>
            <input type="number" id="price" name="price" />
          </div>

          <div class="form-group">
            <label for="publishDate">출판일:</label>
            <input type="date" id="publishDate" name="publishDate" />
          </div>

          <div class="form-group">
            <label for="language">언어:</label>
            <input type="text" id="language" name="language" />
          </div>

          <div class="form-group">
            <label for="pageCount">페이지 수:</label>
            <input type="number" id="pageCount" name="pageCount" />
          </div>

          <div class="form-group">
            <label for="publisher">출판사:</label>
            <input type="text" id="publisher" name="publisher" />
          </div>

          <div class="form-group">
            <label for="edition">에디션:</label>
            <input type="text" id="edition" name="edition" />
          </div>

          <div class="form-group">
            <label for="coverImageUrl">표지 이미지 URL:</label>
            <input type="url" id="coverImageUrl" name="coverImageUrl" />
          </div>
        </div>

        <!-- 설명은 한 줄을 다 쓰도록 그리드 바깥에 둡니다. -->
        <div class="form-group">
          <label for="description">설명:</label>
          <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <div class="button-group">
          <button type="submit">도서 등록</button>
          <!-- onclick 속성 대신 id 로 찾아 addEventListener 로 연결합니다.
               모듈 안의 함수는 전역이 아니므로 onclick="..." 으로는 부를 수 없습니다. -->
          <button type="button" class="cancel-btn" id="cancelButton" style="display: none">취소</button>
          <span class="error-message" id="formError"></span>
        </div>
      </form>
    </div>

    <div class="table-container">
      <h2>도서 목록</h2>
      <div id="loadingMessage" class="loading" style="display: none">로딩 중...</div>
      <table id="bookTable">
        <thead>
          <tr>
            <th>제목</th>
            <th>저자</th>
            <th>ISBN</th>
            <th>가격</th>
            <th>출판일</th>
            <th>출판사</th>
            <th>액션</th>
          </tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
      </table>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
